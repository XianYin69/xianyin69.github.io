name: Deploy Vue Site

on:
  push:
    branches:
      - main # 只有当代码推送到 main 分支时才触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # 采用较稳定的 Node.js 版本
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dev/dist # 核心：指向你 Vue 编译后生成的静态文件夹（默认是 dist）

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4