name: Deploy Vue Site

on:
  push:
    branches:
      - main # 只有当代码推送到 main 分支时才触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    # 核心修正：指定后续所有 run 命令默认在 dev 文件夹下执行
    defaults:
      run:
        working-directory: ./dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 核心修正：指向 dev 文件夹内打包生成的 dist 目录
          path: ./dev/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4