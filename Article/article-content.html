<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XianYin69 - 文章</title>
    <link rel="icon" href="../assets/intro-ClAmIAr9.svg">

    <!-- marked.js + highlight.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>

    <style>
        /* ===== 共享变量（提取自 AboutMe） ===== */
        :root {
            --primary: #0aefeb;
            --primary-dim: #05b6b3;
            --primary-mid: #0cd6d3;
            --primary-light: #0adeda;
            --bg-accent: rgb(14 241 236 / 0.14);
            --bg-card: rgb(19 247 248 / 0.11);
            --bg-section: rgb(37 218 209 / 0.36);
            --bg-intro: rgb(11 228 216 / 0.17);
            --font-stack: Arial, Helvetica, sans-serif;
            --font-body: 'Source Sans Pro', sans-serif;
        }

        /* ===== 全局 ===== */
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            background: url("../assets/background-C9m4Fl5w.svg") no-repeat fixed center;
            background-size: cover;
            overflow-x: hidden;
            color: #1a1a2e;
        }

        /* ===== 主容器：最大 1200px 居中 ===== */
        .mainPage {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1vw;
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }

        /* ===== 顶部导航（复用 AboutMe .head 样式） ===== */
        .head {
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 2vw;
            justify-content: center;
            padding: 1vw 0;
        }
        .head a {
            text-decoration: none;
            -webkit-text-fill-color: var(--primary);
            font-weight: bold;
            font-size: 1.4rem;
            text-shadow: 0.1vw 0.1vw 0.5vw #9ff4fc;
            transition: 0.2s;
        }
        .head a:hover {
            -webkit-text-fill-color: #1ed4ef;
            text-shadow: 0.1vw 0.1vw 0.5vw #bafcff;
        }

        /* ===== 文章容器 ===== */
        .article-container {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 2vw;
            max-width: 100%;
        }

        /* 作者信息 */
        #article-meta {
            font-size: 1rem;
            color: var(--primary-dim);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--bg-accent);
        }

        /* Markdown 主体：最大 720px 居中 */
        .markdown-body {
            max-width: 720px;
            margin: 0 auto;
            font-size: 1.1rem;
            line-height: 1.8;
            color: #1a1a2e;
        }

        /* 标题 */
        .markdown-body h1, .markdown-body h2,
        .markdown-body h3, .markdown-body h4,
        .markdown-body h5, .markdown-body h6 {
            color: var(--primary-dim);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            font-weight: 700;
        }
        .markdown-body h1 { font-size: 2rem; }
        .markdown-body h2 { font-size: 1.6rem; }
        .markdown-body h3 { font-size: 1.3rem; }

        /* 段落 */
        .markdown-body p {
            margin: 0.8em 0;
        }

        /* 加粗 / 斜体 / 删除线 */
        .markdown-body strong { font-weight: 700; color: var(--primary-mid); }
        .markdown-body em { font-style: italic; }
        .markdown-body del { color: #888; }

        /* 列表 */
        .markdown-body ul, .markdown-body ol {
            padding-left: 2em;
            margin: 0.8em 0;
        }
        .markdown-body li {
            margin: 0.3em 0;
        }
        .markdown-body li input[type="checkbox"] {
            margin-right: 0.4em;
            accent-color: var(--primary);
        }

        /* 代码块：允许横向滚动，不撑破布局 */
        .markdown-body pre {
            background: #1a1a2e;
            border-radius: 0.5rem;
            padding: 1em;
            overflow-x: auto;
            margin: 1em 0;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .markdown-body code {
            font-family: 'Fira Code', monospace;
            border-radius: 0.25rem;
        }
        /* 行内代码 */
        .markdown-body :not(pre) > code {
            background: var(--bg-accent);
            padding: 0.2em 0.4em;
            font-size: 0.9em;
            color: var(--primary-mid);
        }

        /* 引用块 */
        .markdown-body blockquote {
            border-left: 4px solid var(--primary);
            background: var(--bg-accent);
            padding: 0.8em 1.2em;
            margin: 1em 0;
            border-radius: 0 0.5rem 0.5rem 0;
            font-style: italic;
        }

        /* 表格 */
        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1em 0;
            font-size: 0.95em;
        }
        .markdown-body th, .markdown-body td {
            border: 1px solid var(--bg-section);
            padding: 0.5em 0.8em;
            text-align: left;
        }
        .markdown-body th {
            background: var(--bg-section);
            color: var(--primary-dim);
            font-weight: 700;
        }
        .markdown-body tr:nth-child(even) {
            background: var(--bg-accent);
        }

        /* 水平线 */
        .markdown-body hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
            margin: 2em 0;
        }

        /* 图片：限制宽度，居中 */
        .markdown-body img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1em auto;
            border-radius: 0.5rem;
        }

        /* 链接 */
        .markdown-body a {
            color: var(--primary-mid);
            text-decoration: none;
            border-bottom: 1px dashed var(--primary);
        }
        .markdown-body a:hover {
            color: #1ed4ef;
        }

        /* 脚注（marked 默认将 [^1] 转为 <sup>） */
        .markdown-body sup {
            font-size: 0.8em;
        }
        .markdown-body .footnotes {
            margin-top: 2em;
            padding-top: 1em;
            border-top: 1px solid var(--bg-section);
            font-size: 0.9em;
            color: #555;
        }

        /* ===== 错误提示样式 ===== */
        #article-error {
            text-align: center;
            padding: 3rem 1rem;
            color: #c0392b;
            font-size: 1.1rem;
            background: rgba(231, 76, 60, 0.08);
            border-radius: 0.5rem;
            margin-top: 1rem;
        }
        #article-error h3 { margin: 0 0 0.5em; font-size: 1.3rem; }

        /* ===== 移动端响应式 ===== */
        @media screen and (max-width: 768px) {
            :root { font-size: 14px; }
            .head {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
                padding: 0.8rem 0;
            }
            .head a { font-size: 1.1rem; }
            .article-container { padding: 1rem; }
            .markdown-body { font-size: 1rem; }
            .markdown-body h1 { font-size: 1.5rem; }
            .markdown-body h2 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="mainPage">
        <!-- 顶部导航 -->
        <div class="head">
            <a id="head-home" href="../zh-CN/index.html">主页</a>
            <a id="head-project" href="../zh-CN/Project/index.html">项目</a>
            <a id="head-link" href="../zh-CN/Link/index.html">相关链接</a>
            <a id="head-article" href="./article-index.html" style="color:#0aefeb">文章</a>
        </div>

        <!-- 文章主体区域 -->
        <div class="article-container">
            <!-- 作者信息栏 -->
            <div id="article-meta"></div>

            <!-- Markdown 渲染区 -->
            <div id="article-body" class="markdown-body"></div>

            <!-- 错误提示区（默认隐藏） -->
            <div id="article-error" style="display:none;"></div>
        </div>
    </div>

    <script>
        // ===== marked 配置 =====
        marked.setOptions({
            highlight: function(code, lang) {
                const language = hljs.getLanguage(lang) ? lang : null;
                return hljs.highlight(code, { language }).value;
            }
        });

        // ===== Front-matter 解析 =====
        function parseFrontMatter(mdText) {
            const lines = mdText.split('\n');
            if (lines[0].trim() === '---') {
                // 找到第二个 ---
                let endIdx = -1;
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '---') {
                        endIdx = i;
                        break;
                    }
                }
                if (endIdx !== -1) {
                    const frontMatterBlock = lines.slice(1, endIdx).join('\n');
                    const authorMatch = frontMatterBlock.match(/^author\s*:\s*(.+)$/mi);
                    if (authorMatch) {
                        return { author: authorMatch[1].trim(), body: lines.slice(endIdx + 1).join('\n') };
                    }
                }
            }
            // 无 front-matter，检查首段是否含"作者：xxx"
            const authorRegex = /作者[：:]\s*(.+)/m;
            const authorFromContent = mdText.match(authorRegex);
            if (authorFromContent) {
                return { author: authorFromContent[1].trim(), body: mdText };
            }
            return { author: null, body: mdText };
        }

        // ===== 外链处理 =====
        function handleExternalLinks(container) {
            const links = container.querySelectorAll('a[href]');
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href && (href.startsWith('http://') || href.startsWith('https://')) &&
                    !href.includes('xianyin69.github.io')) {
                    link.setAttribute('target', '_blank');
                    link.setAttribute('rel', 'noopener');
                }
            });
        }

        // ===== 备用导航：渲染 article-index.json 列表 =====
        function renderFallbackNav() {
            fetch('./article-index.json')
                .then(response => response.json())
                .then(articleList => {
                    const errorDiv = document.getElementById('article-error');
                    let html = '<h3>文章未找到或加载失败</h3><p>请检查 URL 参数。</p>';
                    if (articleList && articleList.length) {
                        html += '<hr style="margin:1em 0"><p><strong>所有文章：</strong></p><ul style="text-align:left;max-width:400px;margin:0 auto">';
                        articleList.forEach(item => {
                            html += `<li><a href="./article-content.html?article=${encodeURIComponent(item.file || '')}">${item.title}</a></li>`;
                        });
                        html += '</ul>';
                    }
                    errorDiv.innerHTML = html;
                    errorDiv.style.display = 'block';
                })
                .catch(() => {
                    const errorDiv = document.getElementById('article-error');
                    errorDiv.innerHTML = '<h3>文章未找到或加载失败</h3><p>请检查 URL 参数。</p>';
                    errorDiv.style.display = 'block';
                });
        }

        // ===== 主逻辑 =====
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const articleName = params.get('article');

            if (!articleName) {
                renderFallbackNav();
                return;
            }

            fetch('./' + encodeURIComponent(articleName))
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.text();
                })
                .then(mdText => {
                    const { author, body } = parseFrontMatter(mdText);

                    // 作者信息
                    const metaDiv = document.getElementById('article-meta');
                    metaDiv.textContent = author ? `作者：${author}` : '作者：未知';

                    // 渲染 Markdown
                    const articleBody = document.getElementById('article-body');
                    articleBody.innerHTML = marked.parse(body);

                    // 外链处理
                    handleExternalLinks(articleBody);

                    // 隐藏错误区
                    document.getElementById('article-error').style.display = 'none';
                })
                .catch(err => {
                    console.error('文章加载失败:', err);
                    renderFallbackNav();
                });
        });
    </script>
</body>
</html>
