<!--- Generated By AI --->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>
            document.addEventListener("DOMContentLoaded", () => {
                fetch('./article-index.json')
                    .then(response => response.json())
                    .then(articleList => {
                        const content = document.getElementById('content');
                        content.innerHTML = "";
                        articleList.forEach(Item => {
                            //Article Item
                            const item = document.createElement('div');
                            item.className = 'item';

                            //Article Link
                            const link = document.createElement('a');
                            link.className = 'link';
                            link.href = Item.url || '#';
                            link.target = '_top';
                            link.textContent = Item.title;

                            //Article Editor and time
                            const meta = document.createElement('div');
                            meta.className = 'meta';
                            meta.textContent = `${Item.editor} | ${Item.time}`;

                            item.appendChild(link);
                            item.appendChild(meta);
                            content.appendChild(item);
                        });
                    })
            })
        </script>
        <style>
            a {
                text-decoration: none;
                -webkit-text-fill-color: #0f8a88;
                font-size: 1.5rem;
            }

            body {
                overflow-x: hidden;
                font-family: 'Source Sans Pro', sans-serif;
                height: auto;
                width: 100%;
            }

            .item {
                position: relative;
                background: rgb(19 247 248 / 0.11);
            }

            .link {
                width: 100%;
                height: auto;
                position: relative;
                left: 0.4rem;
                top: 0.2rem;
            }

            .meta {
                position: relative;
                -webkit-text-fill-color: #0adeda;
                font-size: 1rem;
                left: 1.2rem;
            }
        </style>
    </head>
    <body>
        <div id="content"></div>
    </body>
</html>
