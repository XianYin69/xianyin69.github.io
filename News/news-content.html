<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XianYin69 - 新闻</title>
    <link rel="icon" href="../assets/intro-ClAmIAr9.svg">

    <style>
        /* ===== 共享变量 ===== */
        :root {
            --primary: #0aefeb;
            --primary-dim: #05b6b3;
            --primary-mid: #0cd6d3;
            --primary-light: #0adeda;
            --bg-accent: rgb(14 241 236 / 0.14);
            --bg-card: rgb(19 247 248 / 0.11);
            --bg-section: rgb(37 218 209 / 0.36);
            --bg-intro: rgb(11 228 216 / 0.17);
            --font-stack: Arial, Helvetica, sans-serif;
            --font-body: 'Source Sans Pro', sans-serif;
        }

        /* ===== 全局 ===== */
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            background: url("../assets/background-C9m4Fl5w.svg") no-repeat fixed center;
            background-size: cover;
            overflow-x: hidden;
            color: #1a1a2e;
        }

        /* ===== 主容器：最大 1200px 居中 ===== */
        .mainPage {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1vw;
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }

        /* ===== 顶部导航 ===== */
        .head {
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 2vw;
            justify-content: center;
            padding: 1vw 0;
        }
        .head a {
            text-decoration: none;
            -webkit-text-fill-color: var(--primary);
            font-weight: bold;
            font-size: 1.4rem;
            text-shadow: 0.1vw 0.1vw 0.5vw #9ff4fc;
            transition: 0.2s;
        }
        .head a:hover {
            -webkit-text-fill-color: #1ed4ef;
            text-shadow: 0.1vw 0.1vw 0.5vw #bafcff;
        }

        /* ===== 新闻卡片容器 ===== */
        .news-container {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 2vw;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* 单条新闻 */
        .item {
            position: relative;
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            background: var(--bg-accent);
            transition: background 0.2s;
        }
        .item:hover {
            background: var(--bg-section);
        }

        /* 新闻标题链接 */
        .link {
            display: block;
            text-decoration: none;
            -webkit-text-fill-color: var(--primary-mid);
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.4rem;
            transition: color 0.2s;
        }
        .link:hover {
            -webkit-text-fill-color: #1ed4ef;
        }

        /* 编辑者与时间 */
        .meta {
            -webkit-text-fill-color: var(--primary-dim);
            font-size: 0.9rem;
        }

        /* ===== 移动端响应式 ===== */
        @media screen and (max-width: 768px) {
            :root { font-size: 14px; }
            .head {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
                padding: 0.8rem 0;
            }
            .head a { font-size: 1.1rem; }
            .news-container { padding: 1rem; gap: 0.8rem; }
            .link { font-size: 1rem; }
            .meta { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="mainPage">
        <!-- 顶部导航 -->
        <div class="head">
            <a id="head-home" href="../zh-CN/index.html">主页</a>
            <a id="head-project" href="../zh-CN/Project/index.html">项目</a>
            <a id="head-link" href="../zh-CN/Link/index.html">相关链接</a>
            <a id="head-article" href="../Article/article-index.html">文章</a>
            <a id="head-news" href="./news-index.html" style="color:#0aefeb">新闻</a>
        </div>

        <!-- 新闻列表容器 -->
        <div id="content" class="news-container"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('./news-index.json')
                .then(response => response.json())
                .then(NewsList => {
                    const content = document.getElementById('content');
                    content.innerHTML = "";
                    NewsList.forEach(Item => {
                        //Item
                        const item = document.createElement('div');
                        item.className = 'item';

                        //Link
                        const link = document.createElement('a');
                        link.className = 'link';
                        link.href = Item.url || '#';
                        link.target = '_top';
                        link.textContent = Item.title;

                        //Editor and time
                        const meta = document.createElement('div');
                        meta.className = 'meta';
                        meta.textContent = `${Item.editor} | ${Item.time}`;

                        item.appendChild(link);
                        item.appendChild(meta);
                        content.appendChild(item);
                    });
                })
        })
    </script>
</body>
</html>
