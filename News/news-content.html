<!--- Generated By AI --->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('./news-index.json')
                .then(response => response.json())
                .then(NewsList => {
                    const content = document.getElementById('content');
                    content.innerHTML = "";
                    NewsList.forEach(Item => {
                        //Item
                        const item = document.createElement('div');
                        item.className = 'item';

                        //Link
                        const link = document.createElement('a');
                        link.className = 'link';
                        link.href = Item.url || '#';
                        link.target = '_top';
                        link.textContent = Item.title;

                        //Editor and time
                        const meta = document.createElement('div');
                        meta.className = 'meta';
                        meta.textContent = `${Item.editor} | ${Item.time}`;

                        item.appendChild(link);
                        item.appendChild(meta);
                        content.appendChild(item);
                    });
                })
        })
    </script>
    <style>
        a {
            text-decoration: none;
            -webkit-text-fill-color: #0f8a88;
            font-size: 6vw;
        }

        body {
            overflow-x: hidden;
            font-family: 'Source Sans Pro', sans-serif;
            height: auto;
            width: 100%;
        }

        .item {
            position: relative;
            background: rgb(19 247 248 / 0.11);
        }

        .link {
            width: 100%;
            height: auto;
            position: relative;
            left: 0.4vw;
            top: 0.2vh;
        }

        .meta {
            position: relative;
            -webkit-text-fill-color: #0adeda;
            font-size: 4vw;
            left: 1.2vw;
        }
    </style>
</head>
<body>
<div id="content"></div>
</body>
</html>
