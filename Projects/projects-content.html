<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XianYin69 - 项目</title>
    <link rel="icon" href="../assets/intro-ClAmIAr9.svg">

    <style>
        /* ===== 共享变量 ===== */
        :root {
            --primary: #0aefeb;
            --primary-dim: #05b6b3;
            --primary-mid: #0cd6d3;
            --primary-light: #0adeda;
            --bg-accent: rgb(14 241 236 / 0.14);
            --bg-card: rgb(19 247 248 / 0.11);
            --bg-section: rgb(37 218 209 / 0.36);
            --bg-intro: rgb(11 228 216 / 0.17);
            --font-stack: Arial, Helvetica, sans-serif;
            --font-body: 'Source Sans Pro', sans-serif;
        }

        /* ===== 全局 ===== */
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            background: url("../assets/background-C9m4Fl5w.svg") no-repeat fixed center;
            background-size: cover;
            overflow-x: hidden;
            color: #1a1a2e;
        }

        /* ===== 主容器：最大 1200px 居中 ===== */
        .mainPage {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1vw;
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }

        /* ===== 顶部导航 ===== */
        .head {
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 2vw;
            justify-content: center;
            padding: 1vw 0;
        }
        .head a {
            text-decoration: none;
            -webkit-text-fill-color: var(--primary);
            font-weight: bold;
            font-size: 1.4rem;
            text-shadow: 0.1vw 0.1vw 0.5vw #9ff4fc;
            transition: 0.2s;
        }
        .head a:hover {
            -webkit-text-fill-color: #1ed4ef;
            text-shadow: 0.1vw 0.1vw 0.5vw #bafcff;
        }

        /* ===== 项目卡片容器 ===== */
        .projects-container {
            background: var(--bg-card);
            border-radius: 1rem;
            padding: 2vw;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        /* 单个项目 */
        .item {
            position: relative;
            padding: 0.8rem 1rem;
            border-radius: 0.5rem;
            background: var(--bg-accent);
            transition: background 0.2s;
        }
        .item:hover {
            background: var(--bg-section);
        }

        /* 项目标题链接 */
        .link {
            display: block;
            text-decoration: none;
            -webkit-text-fill-color: var(--primary-mid);
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 0.3rem;
            transition: color 0.2s;
        }
        .link:hover {
            -webkit-text-fill-color: #1ed4ef;
        }

        /* 项目描述 */
        .description {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            line-height: 1.5;
        }

        /* 编辑者、时间、平台、状态 */
        .meta {
            -webkit-text-fill-color: var(--primary-dim);
            font-size: 0.9rem;
        }

        /* 状态标签 */
        .state-tag {
            display: inline-block;
            padding: 0.1rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.8rem;
            font-weight: 700;
            margin-left: 0.4rem;
        }
        .state-tag-develop   { background: #e8f5e9; color: #2e7d32; }
        .state-tag-finish    { background: #e3f2fd; color: #1565c0; }
        .state-tag-archive    { background: #eceff1; color: #546e7a; }

        /* ===== 移动端响应式 ===== */
        @media screen and (max-width: 768px) {
            :root { font-size: 14px; }
            .head {
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
                padding: 0.8rem 0;
            }
            .head a { font-size: 1.1rem; }
            .projects-container { padding: 1rem; gap: 0.8rem; }
            .link { font-size: 1rem; }
            .description { font-size: 0.85rem; }
            .meta { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="mainPage">
        <!-- 顶部导航 -->
        <div class="head">
            <a id="head-home" href="../zh-CN/index.html">主页</a>
            <a id="head-project" href="../zh-CN/Project/index.html" style="color:#0aefeb">项目</a>
            <a id="head-link" href="../zh-CN/Link/index.html">相关链接</a>
            <a id="head-article" href="../Article/article-index.html">文章</a>
            <a id="head-news" href="../News/news-index.html">新闻</a>
        </div>

        <!-- 项目列表容器 -->
        <div id="content" class="projects-container"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetch('./projects-index.json')
                .then(response => response.json())
                .then(articleList => {
                    const content = document.getElementById('content');
                    content.innerHTML = "";
                    articleList.forEach(Item => {
                        //Article Item
                        const item = document.createElement('div');
                        item.className = 'item';

                        //Article Link
                        const link = document.createElement('a');
                        link.className = 'link';
                        link.href = Item.url || '#';
                        link.target = '_top';
                        link.textContent = Item.title;

                        //Article Description
                        const desc = document.createElement('div');
                        desc.className = 'description';
                        desc.textContent = Item.description || '';
                        if (!Item.description) desc.style.display = 'none';

                        //Article Editor and time and platform
                        const meta = document.createElement('div');
                        meta.className = 'meta';
                        let metaText = `${Item.editor} | ${Item.time}`;
                        if (Item.platform) metaText += ` | ${Item.platform}`;
                        meta.textContent = metaText;

                        //状态标签
                        if (Item.state) {
                            const stateTag = document.createElement('span');
                            stateTag.className = 'state-tag state-tag-' + Item.state;
                            stateTag.textContent = `[${Item.state}]`;
                            meta.appendChild(stateTag);
                        }

                        item.appendChild(link);
                        item.appendChild(desc);
                        item.appendChild(meta);
                        content.appendChild(item);
                    });
                })
        })
    </script>
</body>
</html>
