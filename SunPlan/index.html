<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>太阳计划 · 入口</title>
<link rel="icon" href="../assets/intro-ClAmIAr9.svg">
<style>
:root{--cyan:#0aefeb;--sun:#ffb020;--hot:#ff6a00}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,"Microsoft YaHei",Helvetica,sans-serif;color:#eafcff;
background:url("../assets/background-C9m4Fl5w.svg") no-repeat fixed center;background-size:cover;
display:flex;align-items:center;justify-content:center;padding:24px}
a{color:var(--cyan);text-decoration:none;font-weight:bold;text-shadow:0 .1vw .5vw #9ff4fc}
.wrap{width:min(720px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
</style>
<style>
.sun{width:104px;height:104px;border-radius:50%;position:relative;margin-bottom:4px;
background:radial-gradient(circle at 38% 34%,#fff6d0,#ffd76a 32%,var(--sun) 58%,var(--hot) 82%);
box-shadow:0 0 34px rgba(255,176,32,.55),0 0 90px rgba(255,106,0,.35);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.05);filter:brightness(1.12)}}
h1{margin:2px 0 0;font-size:clamp(28px,4.4vw,44px);letter-spacing:.14em;
text-shadow:0 .1vw .6vw rgba(255,176,32,.5)}
.teaser{margin:0;max-width:56ch;font-size:15px;color:#cfe9ef;line-height:1.8}
.badge{font-size:12px;letter-spacing:.16em;padding:5px 14px;border:1px solid rgba(10,239,235,.55);
border-radius:999px;color:var(--cyan);background:rgba(0,20,24,.4)}
.panel{width:min(720px,100%);background:rgba(6,16,20,.72);border:1px solid rgba(10,239,235,.28);
border-radius:14px;padding:20px;backdrop-filter:blur(6px);text-align:left}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
button{font:inherit;font-weight:bold;cursor:pointer;padding:10px 18px;border-radius:10px;border:1px solid var(--cyan);
background:rgba(10,239,235,.14);color:#eafcff;transition:transform .12s ease,background .12s ease}
button:hover{background:rgba(10,239,235,.26);transform:translateY(-1px)}
button.ghost{border-color:rgba(234,252,255,.4);background:transparent;color:#cfe9ef;font-weight:normal}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
input{font:inherit;flex:1 1 260px;padding:10px 12px;border-radius:10px;border:1px solid rgba(234,252,255,.3);
background:rgba(0,0,0,.35);color:#eafcff}
#status{margin:0 0 12px;text-align:center;font-size:14px;color:#cfe9ef;min-height:20px}
#status.err{color:#ffb3a8}
#who{font-size:12.5px;color:#9fd8e0;text-align:center;margin:10px 0 0}
#viewer{width:100%;height:70vh;border:0;border-radius:10px;background:#fff;display:none}
.foot{font-size:12.5px;color:#9fd8e0}
@media (prefers-reduced-motion:reduce){.sun{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="sun" aria-hidden="true"></div>
  <h1>太阳计划</h1>
  <p class="badge">入口 PUBLIC · 正文 PRIVATE</p>
  <p class="teaser">正文不在这里。它存放在 GitHub 的私有仓库中，只有用<strong>你自己的 GitHub 账号</strong>登录、且在该仓库读取名单内的人才能解锁；未登录或无权限者只会看到本页。</p>
  <div class="panel">
    <p id="status">正在检查访问方式…</p>
    <div class="row" id="locked">
      <button id="btn-oauth" disabled>使用 GitHub 登录解锁</button>
      <button id="btn-pages" class="ghost" style="display:none">以 GitHub 身份打开正文</button>
    </div>
    <div class="row" id="tokenbox" style="display:none">
      <input id="token-input" type="password" placeholder="粘贴对该私有仓库具读取权限的 Token（ghp_ / github_pat_）" autocomplete="off" spellcheck="false">
      <button id="btn-token-go">解锁</button>
    </div>
    <div class="row" id="manual">
      <button id="btn-manual" class="ghost">改用粘贴 Token 解锁</button>
    </div>
    <iframe id="viewer" sandbox="allow-scripts" title="太阳计划正文"></iframe>
    <div class="row" id="unlockedbar" style="display:none">
      <button id="btn-lock" class="ghost">退出查看</button>
    </div>
    <p id="who"></p>
  </div>
  <p class="foot"><a href="../zh-CN/index.html">← 返回主页</a> · <a href="https://github.com/XianYin69" rel="noopener noreferrer">GitHub</a></p>
</div>
<script src="gate.js"></script>
</body>
</html>
