<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>XianYin69 - 项目</title>
    <link rel="icon" href="../../assets/intro-ClAmIAr9.svg">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            width: auto;
            height: auto;
            background: url("../../assets/background-C9m4Fl5w.svg") no-repeat center center fixed;
            background-size: cover;
            overflow-x: hidden;
        }
        .mainPage {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 2vh;
        }

        .head {
            width: 30vw;
            display: flex;
            flex-direction: row;
            gap: 2vw;
            position: relative;
            font-size: 1.8vw;
            left: 36vw;
            justify-content: center;
        }
        #head-home {
            text-decoration: none;
            -webkit-text-fill-color: #0aefeb;
            font-weight: bold;
            text-shadow: 0.1vw 0.1vw 0.5vw #9ff4fc;
        }
        #head-home:hover {
            -webkit-text-fill-color: #1ed4ef;
            text-shadow: 0.1vw 0.1vw 0.5vw #bafcff;
        }

        #head-aboutMe {
            text-decoration: none;
            -webkit-text-fill-color: #0aefeb;
            font-weight: bold;
            text-shadow: 0.1vw 0.1vw 0.5vw #9ff4fc;
        }
        #head-aboutMe:hover {
            -webkit-text-fill-color: #1ed4ef;
            text-shadow: 0.1vw 0.1vw 0.5vw #bafcff;
        }
        #head-link {
            text-decoration: none;
            -webkit-text-fill-color: #0aefeb;
            font-weight: bold;
            text-shadow: 0.1vw 0.1vw 0.5vw #9ff4fc;
        }
        #head-link:hover {
            -webkit-text-fill-color: #1ed4ef;
            text-shadow: 0.1vw 0.1vw 0.5vw #bafcff;
        }

        .body {
            width: 100vw;
            height: auto;
            display: flex;
            flex-direction: column;
            gap: 5vh;
        }

        .body-title {
            width: 98.5vw;
            height: 25vh;
            display: flex;
            flex-direction: row;
            gap: 3vw;
            background: rgb(116 246 243 / 0.49);
        }

        #body-title-icon {
            width: 15vw;
            height: 15vw;
            position: relative;
            left: 1vw;
        }

        #body-title-icon-img {
            width: 15vw;
            height: 15vw;
        }

        #body-title-text {
            width: 20vw;
            height: 20vw;
            font-size: 5vw;
            position:relative;
            top: 12vh;
            -webkit-text-fill-color: black;
            font-weight: lighter;
        }

        .project-item {
            display: flex;
            flex-direction: row;
            gap: 1vw;
            width: 98.5vw;
            height: 10vh;
            background: rgb(116 246 243 / 0.49);
        }

        .project-item-area-0 {
            width: 35vw;
            height: auto;
            position: relative;
            left: 1vw;
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }

        #project-item-name {
            width: 30vw;
            height: auto;
            display: flex;
            flex-direction: row;
            gap: 1vw;
        }

        #project-item-name-icon {
            width: 2vw;
            height: 2vw;
            position: relative;
            top: 0.5vh;
        }

        #item-name-icon-img {
            width: 2vw;
            height: 2vw;
        }

        #project-item-time-text {
            font-size: 2vw;
        }

        #project-item-time {
            display: flex;
            flex-direction: row;
            gap: 1vw;
            font-weight: lighter;
            position: relative;
            left: 3.25vw;
        }

        #item-time-tip {
            font-size: 2.7vh;
        }

        #item-time-real {
            font-size: 2.5vh;
        }

        .project-item-area-1 {
            width: 35vw;
            height: auto;
            display: flex;
            flex-direction: row;
            gap: 1vw;
        }

        #project-item-desc {
            width: 25vw;
            height: auto;
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }

        #project-item-desc-tip {
            font-size: 1.5vw;
        }

        #project-item-desc-word {
            height: 5vh;
            font-size: 0.90vw;
            font-weight: lighter;
            position: relative;
            left: 0.5vw;
        }

        .project-item-state {
            display: flex;
            flex-direction: column;
            gap: 1vh;
        }

        #project-item-state-tip {
            font-size: 1.5vw;
        }

        #project-item-state-color {
            width: 4vw;
            height: 3vh;
            position: relative;
            left: 0.5vw;
        }

        .project-item-area-2 {
            width: 10vw;
            height: 10vh;
            display: flex;
            flex-direction: column;
            gap: 1vh;
            position: relative;
            left: 15vw;
        }

        #project-item-link {
            font-size: 3vh;
        }

        #project-item-link-icon {
            width: 2vw;
            height: 2vw;
            position: relative;
            left: 0.5vw;
        }

        #item-link-icon-img {
            width: 2vw;
            height: 2vw;
        }
    </style>
    <script>
        //Generated by Gemini
        //Update Information from json
        document.addEventListener("DOMContentLoaded", () => {
            fetch('../../Projects/projects-index.json')
                .then(response => response.json())
                .then(articleList => {
                    const bodyContainer = document.querySelector('.body');
                    const templateItem = document.querySelector('.project-item');

                    articleList.forEach((item, index) => {
                        let projectItem;
                        if (index === 0 && templateItem) {
                            projectItem = templateItem;
                        } else {
                            projectItem = templateItem.cloneNode(true);
                            bodyContainer.appendChild(projectItem);
                        }

                        projectItem.querySelector('#project-item-time-text').textContent = item.title;
                        projectItem.querySelector('#item-time-real').textContent = item.time;
                        projectItem.querySelector('#project-item-desc-word').textContent = item.description;

                        const linkArea = projectItem.querySelector('.project-item-area-2');
                        linkArea.style.cursor = 'pointer';
                        linkArea.onclick = () => {
                            window.location.href = item.url;
                        };

                        const stateColorEl = projectItem.querySelector('#project-item-state-color');
                        if (item.state === 'test') {
                            stateColorEl.style.background = '#0aebef'; // 例如红色
                        } else if (item.state === 'develop') {
                            stateColorEl.style.background = '#e3e309'; // 例如黄色
                        } else if (item.state === 'finish') {
                            stateColorEl.style.background = '#0aef51'; // 例如绿色
                        } else if (item.state === 'archive') {
                            stateColorEl.style.background = '#ef0a0a';
                        } else {
                            stateColorEl.style.background = '#808080'; // 默认灰色
                        }
                    });
                })
                .catch(error => console.error('Error loading projects:', error));
        });
    </script>
</head>
<body>
    <div class="mainPage">
        <div class="head">
            <a id="head-link" href="../Link/index.html">Link</a>
            <a id="head-home" href="../index.html">Home</a>
            <a id="head-aboutMe" href="../AboutMe/index.html">About Me</a>
        </div>
        <div class="body">
            <div class="body-title">
                <div id="body-title-icon">
                    <img id="body-title-icon-img" src="../../assets/icon-project-title.svg" alt="">
                </div>
                <div id="body-title-text">Project</div>
            </div>
            <div class="project-item">
                <div class="project-item-area-0">
                    <div id="project-item-name">
                        <div id="project-item-name-icon">
                            <img id="item-name-icon-img" src="../../assets/icon-project-arch.svg" alt=""/>
                        </div>
                        <div id="project-item-time-text">Project Name</div>
                    </div>
                    <div id="project-item-time">
                        <div id="item-time-tip">Update date：</div>
                        <div id="item-time-real">yyyy-mm-dd</div>
                    </div>
                </div>
                <div class="project-item-area-1">
                    <div id="project-item-desc">
                        <div id="project-item-desc-tip">Description：</div>
                        <div id="project-item-desc-word">description...</div>
                    </div>
                    <div class="project-item-state">
                        <div id="project-item-state-tip">Status</div>
                        <div id="project-item-state-color"></div>
                    </div>
                </div>
                <div class="project-item-area-2">
                    <div id="project-item-link">Go··></div>
                    <div id="project-item-link-icon">
                        <img id="item-link-icon-img" src="../../assets/github-BvZbiQmu.svg" alt=""/>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
