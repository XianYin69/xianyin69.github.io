<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XianYin 69 - 主页</title>
    <link rel="icon" href="../assets/intro-ClAmIAr9.svg">
    <link rel="stylesheet" href="./css/index.css">
    <style>
        body {
            width: auto;
            height: auto;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            background: url("../assets/background-C9m4Fl5w.svg") no-repeat fixed center;
            background-size: cover;
        }

        .main-page {
            left: 1rem;
            top: 1rem;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .head {
            width: 30rem;
            display: flex;
            flex-direction: row;
            gap: 2rem;
            position: relative;
            font-size: 1.8rem;
            left: 32rem;
        }

        a {
            text-decoration: none;
            -webkit-text-fill-color: #0aefeb;
            font-weight: bold;
            text-shadow: 0.1rem 0.1rem 0.5rem #9ff4fc;
        }

        a:hover {
            -webkit-text-fill-color: #1ed4ef;
            text-shadow: 0.1rem 0.1rem 0.5rem #bafcff;
        }

        .body {
            width: 50rem;
            position: relative;
            top: 1rem;
            display: flex;
            flex-direction: row;
            gap: 1rem;
            left: 2rem;
        }

        .area-0 {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .area-1 {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .clock {
            width: 30rem;
            height: 10rem;
            position: relative;
            display: flex;
            flex-direction: row;
            gap: 3rem;
            font-size: 2rem;
            background: rgb(14 241 236 / 0.14);
        }

        #clock-num {
            width: 20rem;
            height: auto;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            margin-left: 1rem;
            margin-top: 0.5rem;
        }

        .news {
            width: 30rem;
            height: 20rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 3rem;
            font-size: 3rem;
            background: rgb(14 241 236 / 0.14);
        }

        .project {
            width: 50rem;
            height: 20rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 3rem;
            font-size: 3rem;
            background: rgb(14 241 236 / 0.14);
        }

        .article {
            width: 50rem;
            height: 15rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 3rem;
            font-size: 3rem;
            background: rgb(14 241 236 / 0.14);
        }
    </style>
</head>
<body>
    <div class="main-page">
        <div class="head">
            <a id = "about-me" href="./AboutMe/index.html">关于我</a>
            <a id = "project" href="./Project/index.html">项目</a>
            <a id = "link" href="./Link/index.html">相关链接</a>
        </div>
        <div class="body">
            <div class="area-0">
                <div class="clock">
                    <div id="clock-num">
                        <div id="cn-now">当前时间是：</div>
                        <div id="cn-date">cn-date</div>
                        <div id = "cn-time">cn-time</div>
                    </div>
                    <div id = "clock-real">cr</div>
                </div>
                <div class="news">News</div>
            </div>
            <div class="area-1">
                <div class="project">Project</div>
                <div class="article">Article</div>
            </div>
        </div>
    </div>
</body>
</html>
