<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XianYin 69 - 主页</title>
    <link rel="icon" href="../assets/intro-ClAmIAr9.svg">
    <link rel="stylesheet" href="./css/index.css">
    <link rel="javascript" href="./js/getTime.js">
    <style>
        body {
            width: auto;
            height: auto;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            background: url("../assets/background-C9m4Fl5w.svg") no-repeat fixed center;
            background-size: cover;
        }

        .main-page {
            left: 1rem;
            top: 1rem;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .head {
            width: 30rem;
            display: flex;
            flex-direction: row;
            gap: 2rem;
            position: relative;
            font-size: 1.8rem;
            left: 32rem;
        }

        a {
            text-decoration: none;
            -webkit-text-fill-color: #0aefeb;
            font-weight: bold;
            text-shadow: 0.1rem 0.1rem 0.5rem #9ff4fc;
        }

        a:hover {
            -webkit-text-fill-color: #1ed4ef;
            text-shadow: 0.1rem 0.1rem 0.5rem #bafcff;
        }

        .body {
            width: 50rem;
            position: relative;
            top: 1rem;
            display: flex;
            flex-direction: row;
            gap: 1rem;
            left: 2rem;
        }

        .area-0 {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .area-1 {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .clock {
            width: 30rem;
            height: 10rem;
            position: relative;
            display: flex;
            flex-direction: row;
            gap: 3rem;
            font-size: 2rem;
            background: rgb(14 241 236 / 0.14);
        }

        #clock-num {
            width: 15rem;
            height: auto;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            margin-left: 1rem;
            margin-top: 0.5rem;
        }

        #cn-now {
            width: 15rem;
            height: auto;
            font-size: 1.5rem;
            font-weight: bold;
            -webkit-text-fill-color: #0aefeb;
        }

        #cn-date {
            width: 10rem;
            font-size: 1.1rem;
            font-weight: bold;
            -webkit-text-fill-color: #05b6b3;
        }

        #cn-date:hover {
            text-shadow: 0.1rem 0.1rem 0.1rem #07eeb7;
        }

        #cn-time {
            width: 20rem;
            height: auto;
            -webkit-text-fill-color: #0cd6d3;
        }

        #cn-time:hover {
            text-shadow: 0.1rem 0.1rem 0.2rem #07efda;
        }

        #clock-real {
            width: 7.5rem;
            height: 7.2rem;
            margin-top: 1.5rem;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .analog-clock {
            width: 100%;
            height: 100%;
            border: 0.15rem solid #0f8a88;
            border-radius: 50%;
            position: relative;
            background: rgba(14, 241, 236, 0.05);
            box-shadow: 0 0 0.5rem rgba(10, 239, 235, 0.2);
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 0.1rem;
        }

        .hour-hand {
            width: 0.25rem;
            height: 1.7rem;
            background: #05a19f;
            transform: translateX(-50%) rotate(0deg);
        }

        .minute-hand {
            width: 0.15rem;
            height: 2.8rem;
            background: #2ac5c3;
            transform: translateX(-50%) rotate(0deg);
        }

        .second-hand {
            width: 0.08rem;
            height: 3.5rem;
            background: #05b6b3;
            transform: translateX(-50%) rotate(0deg);
        }

        .center-dot {
            width: 0.4rem;
            height: 0.4rem;
            background: #0aefeb;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .news {
            width: 30rem;
            height: 20rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            font-size: 3rem;
            background: rgb(14 241 236 / 0.14);
        }

        #news-title {
            font-weight: bold;
            width: 20rem;
            height: auto;
            font-size: 2rem;
            -webkit-text-fill-color: #0adeda;
            margin-left: 1.2rem;
            margin-top: 0.2rem;
        }

        #news-content {
            width: 28rem;
            height: auto;
            margin-left: 1rem;
        }

        .project {
            width: 50rem;
            height: 20rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            font-size: 3rem;
            background: rgb(14 241 236 / 0.14);
        }

        #project-title {
            font-weight: bold;
            width: 20rem;
            height: auto;
            font-size: 2rem;
            -webkit-text-fill-color: #0adeda;
            margin-left: 1.2rem;
            margin-top: 0.2rem;
        }

        #project-content {
            width: 48rem;
            height: auto;
            margin-left: 1rem;
        }

        .article {
            width: 50rem;
            height: 15rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            font-size: 3rem;
            background: rgb(14 241 236 / 0.14);
        }

        #article-title {
            font-weight: bold;
            width: 20rem;
            height: auto;
            font-size: 2rem;
            -webkit-text-fill-color: #0adeda;
            margin-left: 1.2rem;
            margin-top: 0.2rem;
        }

        #article-content {
            width: 48rem;
            height: auto;
            margin-left: 1rem;
        }

    </style>
    <script>
        function updateClock() {
            const now = new Date();
            // get Current date
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, "0");
            const day = String(now.getDate()).padStart(2, "0");
            const hour = String(now.getHours()).padStart(2, "0");
            const minute = String(now.getMinutes()).padStart(2, "0");
            const second = String(now.getSeconds()).padStart(2, "0");

            //Compute Clock Hand
            const hourDeg = (hour % 12) * 30 + minute * 0.5;
            const minuteDeg = minute * 6 + second * 0.1;
            const secondDeg = second * 6;

            //Write DOM
            const dateElement = document.getElementById('cn-date');
            const timeElement = document.getElementById('cn-time');

            const hourHand = document.getElementById('hour-hand');
            const minuteHand = document.getElementById('minute-hand');
            const secondHand = document.getElementById('second-hand');

            if(dateElement) {
                dateElement.textContent = `${year} 年 ${month} 月 ${day} 日`;
            }
            if(timeElement) {
                timeElement.textContent = `${hour} : ${minute} : ${second}`;
            }

            if (hourHand) hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
            if (minuteHand) minuteHand.style.transform = `translateX(-50%) rotate(${minuteDeg}deg)`;
            if (secondHand) secondHand.style.transform = `translateX(-50%) rotate(${secondDeg}deg)`;
        }

        //fresh
        document.addEventListener('DOMContentLoaded', () => {
            updateClock();
            setInterval(updateClock, 1000);
        });
    </script>
</head>
<body>
    <div class="main-page">
        <div class="head">
            <a id = "about-me" href="./AboutMe/index.html">关于我</a>
            <a id = "project" href="./Project/index.html">项目</a>
            <a id = "link" href="./Link/index.html">相关链接</a>
        </div>
        <div class="body">
            <div class="area-0">
                <div class="clock">
                    <div id="clock-num">
                        <div id="cn-now">当前时间是：</div>
                        <div id="cn-date"></div>
                        <div id = "cn-time"></div>
                    </div>
                    <div id="clock-real">
                        <div class="analog-clock">
                            <div class="hand hour-hand" id="hour-hand"></div>
                            <div class="hand minute-hand" id="minute-hand"></div>
                            <div class="hand second-hand" id="second-hand"></div>
                            <div class="center-dot"></div>
                        </div>
                    </div>
                </div>
                <div class="news">
                    <div id="news-title">新闻</div>
                    <div id="news-content">
                        <iframe src="../News/news-content.html" width="100%" height="100%"></iframe>
                    </div>
                </div>
            </div>
            <div class="area-1">
                <div class="project">
                    <div id="project-title">项目</div>
                    <div id="project-content">
                        <iframe src="../Projects/projects-content.html" width="100%" height="100%"></iframe>
                    </div>
                </div>
                <div class="article">
                    <div id="article-title">文章</div>
                    <div id="article-content">
                        <iframe src="../Article/article-content.html" width="100%" height="100%"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
